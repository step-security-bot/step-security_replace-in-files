name: Replace in files
author: step-security
description: Find and replace text in files by matching strings.
inputs:
  encoding:
    description: |-
      (Optional) The encoding of the files to be searched.
      The following values are supported: `ascii`, `utf8`, `utf16le`, `ucs2`, `base64`, `latin1`.
      Defaults to `utf8`.
    required: false
    default: utf8
  exclude:
    description: |-
      (Optional) The files to be excluded from the search.
      It can be the path to a file or a glob pattern (e.g. `**/*.md`).
    required: false
    default: ""
  files:
    description: |-
      The files to be searched.
      It can be the path to a file or a glob pattern (e.g. `**/*.txt`).
    required: true
  max-parallelism:
    description: |-
      (Optional) The maximum number of files to process in parallel.
      Defaults to `10`.
    required: false
    default: "10"
  replacement-text:
    description: The text that will replace the matched text.
    required: true
  search-text:
    description: The text that will be replaced.
    required: true
runs:
  using: node24
  main: dist/index.js
branding:
  icon: edit
  color: blue
